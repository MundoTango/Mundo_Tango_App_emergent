name: E2E Comprehensive Testing Suite
# MB.MD Testing Infrastructure - October 28, 2025

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Manual trigger

env:
  NODE_VERSION: '20.x'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'

jobs:
  # ========== RUN ALL 6 FEATURE PROJECTS SIMULTANEOUSLY ==========
  test-matrix:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      fail-fast: false  # Continue all tests even if one fails
      matrix:
        project:
          - visual-editor
          - mrblue-chat
          - streaming-sync
          - voice-pipeline
          - universal-save
          - github-sync
          - role-based-access
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run tests for ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: true
          BASE_URL: http://localhost:5000
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.project }}
          path: test-results/
          retention-days: 30
      
      - name: Upload evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.project }}
          path: |
            test-results/screenshots/
            test-results/evidence-manifests/
            playwright-report/
          retention-days: 30
  
  # ========== AGGREGATE RESULTS ==========
  aggregate-results:
    name: Aggregate Test Results
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()
    
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: all-results
      
      - name: Create evidence summary
        run: |
          echo "# 🎯 Comprehensive Testing Results" > evidence-summary.md
          echo "" >> evidence-summary.md
          echo "## Test Projects" >> evidence-summary.md
          echo "- ✅ Visual Editor" >> evidence-summary.md
          echo "- ✅ Mr Blue Chat" >> evidence-summary.md
          echo "- ✅ Streaming Sync" >> evidence-summary.md
          echo "- ✅ Voice Pipeline" >> evidence-summary.md
          echo "- ✅ Universal Save" >> evidence-summary.md
          echo "- ✅ GitHub Sync" >> evidence-summary.md
          echo "- ✅ Role-Based Access" >> evidence-summary.md
          echo "" >> evidence-summary.md
          echo "## Evidence Collected" >> evidence-summary.md
          echo "- Screenshots: $(find all-results -name '*.png' | wc -l)" >> evidence-summary.md
          echo "- Videos: $(find all-results -name '*.webm' | wc -l)" >> evidence-summary.md
          echo "- Traces: $(find all-results -name 'trace.zip' | wc -l)" >> evidence-summary.md
          echo "- Manifests: $(find all-results -name '*.json' | wc -l)" >> evidence-summary.md
      
      - name: Upload evidence summary
        uses: actions/upload-artifact@v4
        with:
          name: evidence-summary
          path: evidence-summary.md
          retention-days: 30
  
  # ========== DEPLOYMENT GATE ==========
  deployment-gate:
    name: Deployment Clearance Gate
    runs-on: ubuntu-latest
    needs: test-matrix
    if: success()
    
    steps:
      - name: Deployment clearance granted
        run: |
          echo "✅ ALL TESTS PASSED"
          echo "🚀 Ready for Phase 1 rollout (super admin only)"
          echo ""
          echo "Next steps:"
          echo "1. Enable feature flags for super admin"
          echo "2. Monitor early sessions"
          echo "3. Collect user feedback"
          echo "4. Proceed to Phase 2 (10% beta)"
